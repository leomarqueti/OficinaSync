services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oficinasync-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: oficinasync-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oficinasync-backend
    env_file:
      - ./backend/.env.production
    depends_on:
      - sqlserver
      - minio
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        VITE_API_URL: "https://api.${DOMAIN}"
    container_name: oficinasync-proxy
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  sqlserver_data:
  minio_data:
  caddy_data:
  caddy_config:
